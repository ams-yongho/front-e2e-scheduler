server {
    listen 8080;

    location / {
        root /usr/share/nginx/html/dashboard;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /results/ {
        alias /usr/share/nginx/html/results/;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control 'no-cache, no-store, must-revalidate';
    }
}
